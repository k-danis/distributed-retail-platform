<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Details</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap"
          rel="stylesheet">

    <style>
        /* -----------------------------------------------------------------
           Theme variables – change them in one place to restyle the page
           ----------------------------------------------------------------- */
        :root {
            --bg-body: #f4f4f4;
            --bg-card: #ffffff;
            --primary: #007BFF;
            --text-main: #333333;
            --text-light: #555555;
            --radius: 8px;
            --shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            --font-main: 'Roboto', Arial, sans-serif;
        }

        body {
            font-family: var(--font-main);
            background-color: var(--bg-body);
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }

        .container {
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            background-color: var(--bg-card);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }

        h1 {
            color: var(--text-main);
            margin-bottom: 0.5rem;
        }

        p {
            margin: 0.2rem 0;
            color: var(--text-main);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th,
        td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: left;
        }

        th {
            background-color: var(--primary);
            color: #fff;
        }

        /* ------------------------ Responsive table ------------------------ */
        @media (max-width: 600px) {
            table,
            thead,
            tbody,
            th,
            td,
            tr {
                display: block;
                width: 100%;
            }
            th {
                background: var(--primary);
                color: #fff;
            }
            td {
                border: none;
                padding-left: 50%;
                position: relative;
            }
            td::before {
                content: attr(data-label);
                position: absolute;
                left: 0;
                width: 45%;
                padding-left: 12px;
                font-weight: 500;
                color: var(--text-light);
            }
        }

        .footer {
            margin-top: 20px;
            padding-top: 10px;
            border-top: 1px solid #ddd;
            text-align: center;
            font-size: 0.9rem;
            color: var(--text-light);
        }

        .footer a {
            color: var(--primary);
            text-decoration: none;
        }
    </style>
</head>

<body>
<div class="container">
    <h1>Order Details</h1>

    <p>Customer: <span th:text="${customerName}"></span></p>
    <p>Order ID: <span th:text="${orderReference}"></span></p>

    <table>
        <thead>
        <tr>
            <th>Product Name</th>
            <th>Quantity</th>
            <th>Price</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="product : ${products}">
            <td data-label="Product Name" th:text="${product.name}"></td>
            <td data-label="Quantity" th:text="${product.quantity}"></td>
            <td data-label="Price" th:text="${product.price}"></td>
        </tr>
        </tbody>
    </table>

    <div class="footer">
        <p>Total Amount: $<span th:text="${totalAmount}"></span></p>
        <p>This is an automated message. Please do not reply.</p>
    </div>
</div>
</body>
</html>
