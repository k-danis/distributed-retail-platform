spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: "http://localhost:9098/realms/retail"
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
          routes:
            - id: customer-service
              uri: lb://CUSTOMER-SERVICE
              predicates:
                - Path=/api/v1/customers/**
            - id: order-service
              uri: lb://ORDER-SERVICE
              predicates:
                - Path=/api/v1/orders/**
            - id: order-lines-service
              uri: lb://ORDER-SERVICE
              predicates:
                - Path=/api/v1/order-lines/**
            - id: product-service
              uri: lb://PRODUCT-SERVICE
              predicates:
                - Path=/api/v1/products/**
            - id: payment-service
              uri: lb://PAYMENT-SERVICE
              predicates:
                - Path=/api/v1/payments/**

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: customer-service
        url: /api/v1/customers/v3/api-docs
      - name: order-service
        url: /api/v1/orders/v3/api-docs
      - name: order-lines-service
        url: /api/v1/order-lines/v3/api-docs
      - name: product-service
        url: /api/v1/products/v3/api-docs
      - name: payment-service
        url: /api/v1/payments/v3/api-docs

logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: DEBUG

server:
  port: 8222