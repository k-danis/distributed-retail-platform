global:
  scrape_interval: 5s

scrape_configs:
  - job_name: 'retail-microservices'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets:
          - 'host.docker.internal:8222' # gateway-service
          - 'host.docker.internal:8761' # discovery-service
          - 'host.docker.internal:8040' # notification-service
          - 'host.docker.internal:8050' # product-service
          - 'host.docker.internal:8060' # payment-service
          - 'host.docker.internal:8070' # order-service
          - 'host.docker.internal:8080' # config-server
          - 'host.docker.internal:8090' # customer-service