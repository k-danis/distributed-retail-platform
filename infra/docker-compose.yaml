services:
  postgres:
    container_name: retail-postgres
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - retail-network
    ports:
      - '5432:5432'
    restart: unless-stopped

  pgadmin:
    container_name: retail-pgadmin
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-pgadmin@pgadmin.org}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    volumes:
      - pgadmin:/var/lib/pgadmin
    ports:
      - '5050:80'
    networks:
      - retail-network
    restart: unless-stopped

  mongodb:
    container_name: retail-mongodb
    image: mongo:8.0-noble
    ports:
      - '27017:27017'
    volumes:
      - mongo:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongo
      MONGO_INITDB_ROOT_PASSWORD: secret
    networks:
      - retail-network
    restart: unless-stopped

  mongo-express:
    container_name: retail-mongo-express
    image: mongo-express
    ports:
      - '8081:8081'
    environment:
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: password
      ME_CONFIG_MONGODB_ADMINUSERNAME: mongo
      ME_CONFIG_MONGODB_ADMINPASSWORD: secret
      ME_CONFIG_MONGODB_SERVER: retail-mongodb
    networks:
      - retail-network
    restart: unless-stopped

  redis:
    image: redis:alpine
    container_name: retail-redis-cache
    ports:
      - "6379:6379"
    restart: unless-stopped

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.12
    container_name: retail-zookeeper
    environment:
      ZOOKEEPER_SERVER_ID: 1
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_CLIENT_PORT: 2181
    ports:
      - '22181:2181'
    networks:
      - retail-network
  kafka:
    image: confluentinc/cp-kafka:7.6.12
    container_name: retail-kafka
    ports:
      - '9092:9092'
    depends_on:
      - zookeeper
    environment:
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
    networks:
      - retail-network

  mail-dev:
    container_name: retail-mail-dev
    image: maildev/maildev
    ports:
      - '1080:1080'
      - '1025:1025'
    networks:
      - retail-network
    restart: unless-stopped

  zipkin:
    container_name: retail-zipkin
    image: openzipkin/zipkin
    ports:
      - '9411:9411'
    networks:
      - retail-network

  prometheus:
    container_name: retail-prometheus
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yml

  grafana:
    container_name: retail-grafana
    image: grafana/grafana:latest
    ports:
      - "3000:3000"

  keycloak:
    container_name: retail-keycloak
    image: quay.io/keycloak/keycloak:24.0.2
    ports:
      - '9098:8080'
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    networks:
      - retail-network
    command:
      - "start-dev"

networks:
  retail-network:
    driver: bridge

volumes:
  postgres_data:
  pgadmin:
  mongo:
